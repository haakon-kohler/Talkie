# Two channels, the way T3 Code runs them:
#
#   nightly  every push to the `nightly` branch rebuilds "Talkie Nightly",
#            versioned <base>-nightly.<date>.<run>, and replaces the DMG on
#            the one rolling `nightly-latest` prerelease. Earlier nightlies
#            are not kept; build the commit from source to go back.
#   stable   a `v*.*.*` tag publishes "Talkie" as the latest release. The
#            tagged commit must already be on `nightly` and on `main`, so
#            stable only ever ships a build nightly users have run.
#
# The two apps have different bundle identifiers (tauri.nightly.conf.json),
# so they install side by side with their own settings, model and grants.
name: Release

on:
  push:
    branches: [nightly]
    tags: ["v*.*.*"]
  workflow_dispatch:

# One release at a time per ref, and never cancel a publisher halfway.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: meta
        name: Resolve the channel and version
        run: |
          base="$(jq -r .version src-tauri/tauri.conf.json)"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::stable tags are plain vX.Y.Z, not $GITHUB_REF_NAME" >&2
              exit 1
            fi
            for branch in nightly main; do
              if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/$branch"; then
                echo "::error::$GITHUB_REF_NAME is not on $branch; promote nightly to main before tagging" >&2
                exit 1
              fi
            done
            {
              echo "channel=stable"
              echo "version=$version"
              echo "tag=$GITHUB_REF_NAME"
              echo "name=Talkie $version"
              echo "overlay="
            } >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF" == refs/heads/nightly ]]; then
            version="$base-nightly.$(date -u +%Y%m%d).$GITHUB_RUN_NUMBER"
            {
              echo "channel=nightly"
              echo "version=$version"
              echo "tag=nightly-latest"
              echo "name=Talkie Nightly"
              echo "overlay=--config src-tauri/tauri.nightly.conf.json"
            } >> "$GITHUB_OUTPUT"
          else
            echo "::error::releases come from the nightly branch or a v*.*.* tag, not $GITHUB_REF" >&2
            exit 1
          fi

      - name: Install the pinned toolchain
        run: rustup toolchain install

      - uses: taiki-e/install-action@v2
        with:
          tool: trunk,tauri-cli

      - uses: Swatinem/rust-cache@v2

      - name: Build
        env:
          OVERLAY: ${{ steps.meta.outputs.overlay }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          # shellcheck disable=SC2086 # OVERLAY is two words or none.
          cargo tauri build --bundles app,dmg $OVERLAY --config "{\"version\":\"$VERSION\"}"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ steps.meta.outputs.channel }}
          TAG: ${{ steps.meta.outputs.tag }}
          NAME: ${{ steps.meta.outputs.name }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          shopt -s nullglob
          dmgs=(target/release/bundle/dmg/*.dmg)
          if (( ${#dmgs[@]} != 1 )); then
            echo "::error::expected one .dmg, found ${#dmgs[@]}" >&2
            exit 1
          fi

          # Each channel ships its DMG under a name that never changes, so one
          # URL always downloads the newest build:
          #   stable   releases/latest/download/Talkie.dmg
          #   nightly  releases/download/nightly-latest/Talkie-Nightly.dmg
          fixed="$(mktemp -d)"
          notes="$(mktemp)"
          if [[ "$CHANNEL" == nightly ]]; then
            cp "${dmgs[0]}" "$fixed/Talkie-Nightly.dmg"
            echo "The newest Talkie Nightly, $VERSION, built from \`${GITHUB_SHA::7}\`: features not yet promoted to stable. Replaced on every push to \`nightly\`." >> "$notes"
          else
            cp "${dmgs[0]}" "$fixed/Talkie.dmg"
            echo "Stable release." >> "$notes"
          fi
          cat >> "$notes" <<'EOF'

          Apple silicon, macOS 13 or later. The app is ad-hoc signed, not notarized: after the first launch is refused, allow it under System Settings → Privacy & Security → Open Anyway.
          EOF

          if [[ "$CHANNEL" == stable ]]; then
            gh release create "$TAG" "${dmgs[@]}" "$fixed/Talkie.dmg" --verify-tag \
              --title "$NAME" --notes-file "$notes" --latest
            exit 0
          fi

          # Nightly: one rolling prerelease, since GitHub's /releases/latest
          # skips prereleases. Its tag moves to this commit and its one asset
          # is replaced. Not named `nightly`, which would make the tag and the
          # branch the same ambiguous ref. The concurrency group above
          # serializes nightly runs, so two never move the tag at once.
          git_api="repos/$GITHUB_REPOSITORY/git"
          if gh api "$git_api/ref/tags/$TAG" --silent 2>/dev/null; then
            gh api -X PATCH "$git_api/refs/tags/$TAG" -f sha="$GITHUB_SHA" -F force=true --silent
          fi
          if gh release view "$TAG" --json tagName --jq .tagName >/dev/null 2>&1; then
            gh release upload "$TAG" "$fixed/Talkie-Nightly.dmg" --clobber
            gh release edit "$TAG" --title "$NAME" --notes-file "$notes" \
              --prerelease --latest=false
          else
            gh release create "$TAG" "$fixed/Talkie-Nightly.dmg" --target "$GITHUB_SHA" \
              --title "$NAME" --notes-file "$notes" --prerelease --latest=false
          fi
