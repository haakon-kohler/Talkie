# Two channels, the way T3 Code runs them:
#
#   nightly  every push to the `nightly` branch publishes "Talkie Nightly"
#            as a GitHub prerelease, versioned <base>-nightly.<date>.<run>.
#   stable   a `v*.*.*` tag publishes "Talkie" as the latest release. The
#            tagged commit must already be on `nightly` and on `main`, so
#            stable only ever ships a build nightly users have run.
#
# The two apps have different bundle identifiers (tauri.nightly.conf.json),
# so they install side by side with their own settings, model and grants.
name: Release

on:
  push:
    branches: [nightly]
    tags: ["v*.*.*"]
  workflow_dispatch:

# One release at a time per ref, and never cancel a publisher halfway.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: meta
        name: Resolve the channel and version
        run: |
          base="$(jq -r .version src-tauri/tauri.conf.json)"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::stable tags are plain vX.Y.Z, not $GITHUB_REF_NAME" >&2
              exit 1
            fi
            for branch in nightly main; do
              if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/$branch"; then
                echo "::error::$GITHUB_REF_NAME is not on $branch; promote nightly to main before tagging" >&2
                exit 1
              fi
            done
            {
              echo "channel=stable"
              echo "version=$version"
              echo "tag=$GITHUB_REF_NAME"
              echo "name=Talkie $version"
              echo "overlay="
            } >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF" == refs/heads/nightly ]]; then
            version="$base-nightly.$(date -u +%Y%m%d).$GITHUB_RUN_NUMBER"
            {
              echo "channel=nightly"
              echo "version=$version"
              echo "tag=v$version"
              echo "name=Talkie Nightly $version"
              echo "overlay=--config src-tauri/tauri.nightly.conf.json"
            } >> "$GITHUB_OUTPUT"
          else
            echo "::error::releases come from the nightly branch or a v*.*.* tag, not $GITHUB_REF" >&2
            exit 1
          fi

      - name: Install the pinned toolchain
        run: rustup toolchain install

      - uses: taiki-e/install-action@v2
        with:
          tool: trunk,tauri-cli

      - uses: Swatinem/rust-cache@v2

      - name: Build
        env:
          OVERLAY: ${{ steps.meta.outputs.overlay }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          # shellcheck disable=SC2086 # OVERLAY is two words or none.
          cargo tauri build --bundles app,dmg $OVERLAY --config "{\"version\":\"$VERSION\"}"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ steps.meta.outputs.channel }}
          TAG: ${{ steps.meta.outputs.tag }}
          NAME: ${{ steps.meta.outputs.name }}
        run: |
          shopt -s nullglob
          dmgs=(target/release/bundle/dmg/*.dmg)
          if (( ${#dmgs[@]} != 1 )); then
            echo "::error::expected one .dmg, found ${#dmgs[@]}" >&2
            exit 1
          fi

          notes="$(mktemp)"
          if [[ "$CHANNEL" == nightly ]]; then
            echo "Nightly build of \`${GITHUB_SHA::7}\`: the newest features, not yet promoted to stable." >> "$notes"
          else
            echo "Stable release." >> "$notes"
          fi
          cat >> "$notes" <<'EOF'

          Apple silicon, macOS 13 or later. The app is ad-hoc signed, not notarized: after the first launch is refused, allow it under System Settings → Privacy & Security → Open Anyway.
          EOF

          if [[ "$CHANNEL" == nightly ]]; then
            gh release create "$TAG" "${dmgs[@]}" --target "$GITHUB_SHA" \
              --title "$NAME" --notes-file "$notes" --prerelease --latest=false
          else
            gh release create "$TAG" "${dmgs[@]}" --verify-tag \
              --title "$NAME" --notes-file "$notes" --latest
          fi
