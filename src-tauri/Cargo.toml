[package]
name = "talkie"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Speak, and it lands in your notes."

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name on Windows.
# https://github.com/rust-lang/cargo/issues/8519
name = "talkie_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
talkie-shared = { workspace = true }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
serde = { workspace = true }
serde_json = { workspace = true }
dirs = "6"
cpal = "0.16"
rubato = "0.16.2"
hound = "3.5"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
chrono = "0.4"
tar = "0.4"
flate2 = "1"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls"] }
handy-keys = "0.3.4"
notify = "8"
futures-util = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
rodio = "0.21"
vad-rs = { git = "https://github.com/cjpais/vad-rs", version = "0.1.6", default-features = false }
transcribe-rs = { version = "0.3.8", features = ["onnx"] }
