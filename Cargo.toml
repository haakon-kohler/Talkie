[workspace]
resolver = "2"
members = ["shared", "ui", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "PolyForm-Noncommercial-1.0.0"
authors = ["Haakon Kohler"]

[workspace.dependencies]
talkie-shared = { path = "shared" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Read the optimization guideline for more details:
# https://tauri.app/concept/size/#cargo-configuration
# Profiles must live in the workspace root to apply.
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
